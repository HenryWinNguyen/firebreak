name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: firebreak
          POSTGRES_PASSWORD: firebreak
          POSTGRES_DB: firebreak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firebreak" --health-interval 5s --health-retries 10
    env:
      FIREBREAK_TEST_DATABASE_URL: postgresql+asyncpg://firebreak:firebreak@localhost:5432/firebreak_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: make check

  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: firebreak
          POSTGRES_PASSWORD: firebreak
          POSTGRES_DB: firebreak_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firebreak" --health-interval 5s --health-retries 10
    env:
      # Name ends _eval so require_eval_database_name passes. Replay is offline: no API keys.
      FIREBREAK_EVAL_DATABASE_URL: postgresql+asyncpg://firebreak:firebreak@localhost:5432/firebreak_eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Fails on a stale recording or any error; graded misses exit 0.
      - run: make eval AGENT=all

  shopfloor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: shopfloor tests
        run: |
          if [ -f shopfloor/pyproject.toml ]; then
            cd shopfloor && uv sync --locked && uv run pytest -q
          else
            echo "shopfloor not built yet"
          fi

  owned-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/check_owned_paths.py --base origin/${{ github.base_ref }}
