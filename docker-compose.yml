# Root compose: lead-only. Tracks own the included files.
include:
  - shopfloor/compose.yml
  - ops/compose.yml

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: firebreak
      POSTGRES_PASSWORD: firebreak
      POSTGRES_DB: firebreak
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firebreak"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      FIREBREAK_DATABASE_URL: postgresql+asyncpg://firebreak:firebreak@postgres:5432/firebreak
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  # Temporal dev server (CLI image): SQLite on a volume, so history survives restarts (~85 MiB).
  # One container instead of server + its own Postgres; fine for dev (CONTRACTS §3.3, M5).
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes: [temporaldata:/home/temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      retries: 20

  # Temporal worker (T-064): workflow + agent activities in one process (ARCH §1 splits them later).
  worker:
    build: .
    command: ["uv", "run", "--no-dev", "python", "-m", "firebreak.workflows.worker"]
    env_file: .env
    environment:
      FIREBREAK_DATABASE_URL: postgresql+asyncpg://firebreak:firebreak@postgres:5432/firebreak
      FIREBREAK_TEMPORAL_ADDRESS: temporal:7233
      FIREBREAK_TOOLS_PROMETHEUS_URL: http://prometheus:9090
      FIREBREAK_TOOLS_LOKI_URL: http://loki:3100
      FIREBREAK_TOOLS_SHOPFLOOR_URLS: '{"gateway": "http://gateway:8100", "orders": "http://orders:8101", "inventory": "http://inventory:8102"}'
      # Ollama runs on the host (Henry's tab), not in compose.
      FIREBREAK_LLM_OPENAI_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }

volumes:
  pgdata:
  temporaldata:
