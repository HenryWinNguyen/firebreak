# Root compose: lead-only. Tracks own the included files.
include:
  - shopfloor/compose.yml
  - ops/compose.yml

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: firebreak
      POSTGRES_PASSWORD: firebreak
      POSTGRES_DB: firebreak
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firebreak"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      FIREBREAK_DATABASE_URL: postgresql+asyncpg://firebreak:firebreak@postgres:5432/firebreak
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  # Temporal dev server (CLI image): SQLite on a volume, so history survives restarts (~85 MiB).
  # One container instead of server + its own Postgres; fine for dev (CONTRACTS §3.3, M5).
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes: [temporaldata:/home/temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  temporaldata:
