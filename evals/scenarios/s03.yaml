id: S3
title: "N+1 query regression"
setup:
  chaos: {orders.n_plus_one: true}
# The flag costs 0.25 s per cart unit; at cart_size 1 p95 stays under 1 s and nothing fires.
load: {rps: 50, duration_s: 300, cart_size: 5}
expect:
  alerts:  # any-of
    - {alertname: HighLatencyP95, service: orders}
  root_cause_category: slow_query
  must_cite_kinds: [metric_series]  # no trace tool exists (CONTRACTS 3.4)
  accepted_actions:  # SCOPE: roll back or disable the feature flag
    - {action: toggle_flag, target: orders}
    - {action: rollback, target: orders}
teardown: {reset_chaos: true}
