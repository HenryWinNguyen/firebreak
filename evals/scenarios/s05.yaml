id: S5
title: "Memory leak"
setup:
  chaos: {orders.leak_kb_per_request: 128}
load: {rps: 50, duration_s: 300, cart_size: 1, hold: duration}
expect:
  alerts:  # any-of
    - {alertname: HighMemory, service: orders}
  root_cause_category: memory_leak
  must_cite_kinds: [metric_series]
  accepted_actions:  # SCOPE: restart now, roll back after
    - {action: restart, target: orders}
    - {action: rollback, target: orders}
teardown: {reset_chaos: true}
