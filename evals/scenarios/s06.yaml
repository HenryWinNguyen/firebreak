id: S6
title: "Bad config push: unreachable Redis host"
setup:
  # UNVALIDATED until T-016's live run. SafeCache swallows Redis errors and a bad DNS name
  # fails fast, so nothing would fire. A non-routable IP makes every cache call hit the
  # connect timeout, which shows up as latency on orders (via the /products path).
  chaos: {orders.redis_host: 10.255.255.1}
load: {rps: 50, duration_s: 300, cart_size: 1}
expect:
  alerts:  # any-of
    - {alertname: HighLatencyP95, service: orders}
  root_cause_category: misconfiguration
  must_cite_kinds: [log_lines]  # "cache get failed ... redis" warning
  accepted_actions:
    - {action: revert_config, target: orders}
teardown: {reset_chaos: true}
