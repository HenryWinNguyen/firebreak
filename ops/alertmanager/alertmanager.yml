route:
  receiver: firebreak
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: firebreak
    webhook_configs:
      - url: http://api:8000/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Written from $FIREBREAK_WEBHOOK_TOKEN by the compose entrypoint.
            credentials_file: /tmp/webhook_token
