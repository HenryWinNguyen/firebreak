[project]
name = "firebreak"
version = "0.1.0"
description = "Multi-agent incident response with evidence-cited findings and human-approved remediation."
authors = [{ name = "HenryWinNguyen", email = "henrynguyen2394@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "BLE", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^shopfloor/", "^evals/", "^dashboard/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs the full compose stack; runs only with FIREBREAK_INTEGRATION=1",
    "db: needs Postgres at FIREBREAK_TEST_DATABASE_URL",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
